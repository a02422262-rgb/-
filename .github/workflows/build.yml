name: build
on: workflow_dispatch
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: Expand-Archive -Path (Get-ChildItem -Filter *.zip | Select-Object -First 1).FullName -DestinationPath app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: app
      - run: npm run dist:win
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: app/dist/*.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: app
      - run: npx cap add android
        working-directory: app
      - run: |
          sed -i 's/android:label="[^"]*"/android:label="Воздушный рубеж"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
        working-directory: app
      - run: npx cap sync android
        working-directory: app
      - run: ./gradlew assembleDebug
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
