name: build
on: workflow_dispatch
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: Expand-Archive -Path (Get-ChildItem -Filter *.zip | Select-Object -First 1).FullName -DestinationPath app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: app
      - run: npm run dist:win
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: app/dist/*.exe
