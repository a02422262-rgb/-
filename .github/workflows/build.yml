
name: Build Air Frontier

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:

  # =========================
  # WINDOWS EXE
  # =========================
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build EXE
        working-directory: app
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/dist/*.exe
          if-no-files-found: error


  # =========================
  # ANDROID APK
  # =========================
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Configure Android
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure application
        working-directory: app
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Воздушный рубеж"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # =========================
  # IOS IPA
  # =========================
  ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Add iOS
        working-directory: app
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS
        working-directory: app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r AirFrontier.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: app/AirFrontier.ipa
          if-no-files-found: error


  # =========================
  # CREATE RELEASE
  # =========================
  release:
    needs: [windows, android, ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish applications
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Air Frontier Build ${{ github.run_number }}
          files: |
            release/windows/*.exe
            release/android/*.apk
            release/ios/*.ipa
          generate_release_notes: true
